<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplified Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Design Tokens & Variables --- */
        :root {
            --bg-dark: #0b0f17;
            --bg-card: #161b26;
            --bg-card-hover: #1f2635;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            
            /* App Icon Gradients */
            --gradient-ai: linear-gradient(135deg, #ff6b6b, #ff8e53);
            --gradient-msg: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --gradient-task: linear-gradient(135deg, #10b981, #059669);
            --gradient-accent: linear-gradient(135deg, #3b82f6, #10b981);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #1e1b4b 0%, #0b0f17 60%);
        }

        /* --- Top Navigation Bar --- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(11, 15, 23, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand span {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            position: relative;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 99px;
            width: 320px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-bar:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* --- Hero Section --- */
        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 80px 40px 40px 40px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 6px 12px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero-text p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 32px;
            max-width: 480px;
        }

        .explore-btn {
            background: var(--gradient-accent);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 99px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .explore-btn:hover {
            transform: translateY(-2px);
        }

        /* --- Grid Layout for Apps --- */
        .app-grid-wrapper {
            position: relative;
            min-height: 250px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .app-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            opacity: 1;
            transform: scale(1);
        }

        .app-card:hover {
            background-color: var(--bg-card-hover);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* State when hidden by search filter */
        .app-card.hidden {
            display: none !important;
        }

        .app-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: white;
        }

        .icon-ai { background: var(--gradient-ai); }
        .icon-msg { background: var(--gradient-msg); }
        .icon-task { background: var(--gradient-task); }

        .app-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .app-info p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* No Results Message */
        .no-results {
            display: none;
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
            padding: 40px 0;
            grid-column: span 2;
        }

        /* --- Custom Toast Notification --- */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: #2563eb;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 968px) {
            .hero-container {
                grid-template-columns: 1fr;
                padding: 40px 24px;
                gap: 40px;
            }
            .hero-text h1 { font-size: 2.5rem; }
            .app-grid { grid-template-columns: 1fr; }
            .no-results { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="brand">
            Simplified <span>Workspace</span>
        </div>
        <div class="search-container">
            <input type="text" id="appSearch" class="search-bar" placeholder="Search apps (e.g., AI, message, focus)...">
        </div>
        <div class="nav-right">
            <div class="avatar">S</div>
        </div>
    </header>

    <main class="hero-container">
        
        <section class="hero-text">
            <div class="status-badge">
                <div class="status-dot"></div>
                All systems online
            </div>
            <h1>Welcome to Simplified Workspace</h1>
            <p>Your streamlined productivity hub. Switch between specialized systems, coordinate team messages, and map out your development objectives seamlessly.</p>
            <button class="explore-btn" onclick="document.getElementById('appsSection').scrollIntoView({behavior: 'smooth'})">Explore apps</button>
        </section>

        <section class="app-grid-wrapper" id="appsSection">
            <div class="app-grid" id="appGrid">
                
                <div class="app-card" id="aiCard" data-title="simpleai ai" data-desc="next-generation processing workspace assistant intelligence">
                    <div class="app-icon icon-ai">AI</div>
                    <div class="app-info">
                        <h3>SimpleAI</h3>
                        <p>Next-generation processing workspace assistant.</p>
                    </div>
                </div>
